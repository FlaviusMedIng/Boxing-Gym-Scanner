<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geneva Gym Scanner — Modifier les critères</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --panel: #ffffff; --text: #1c2128; --muted: #6b7280;
    --border: #e2e5e9; --accent: #2563eb; --good: #16803c; --bad: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --panel: #1c1f24; --text: #e7e9ec; --muted: #9aa1ab;
      --border: #2c3036; --accent: #6ea8fe; --good: #4fd88a; --bad: #ff8177;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header { padding: 24px clamp(16px, 4vw, 40px); border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { margin: 0 0 4px; font-size: 1.4rem; }
  header p { margin: 0; color: var(--muted); font-size: 0.9rem; }
  header a { color: var(--accent); }
  main { padding: 20px clamp(16px, 4vw, 40px) 60px; max-width: 640px; margin: 0 auto; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .field { margin-bottom: 18px; }
  .field label.title { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
  .field input[type="number"] {
    width: 100%; font-size: 1rem; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .districts { display: flex; flex-wrap: wrap; gap: 8px 16px; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
  button {
    width: 100%; padding: 12px; font-size: 1rem; font-weight: 600; border: none;
    border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; margin-top: 8px;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #status { margin-top: 14px; font-size: 0.9rem; }
  #status.ok { color: var(--good); }
  #status.err { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>Modifier les critères de recherche</h1>
  <p>Ces changements seront appliqués automatiquement au prochain scan quotidien. <a href="index.html">← Voir les annonces</a></p>
</header>
<main>
  <div class="panel">
    <form id="f">
      <div class="field">
        <label class="title" for="surface">Surface minimum (m²)</label>
        <input type="number" id="surface" min="1" step="1" value="30" required>
      </div>
      <div class="field">
        <label class="title" for="rent">Loyer maximum (CHF/mois)</label>
        <input type="number" id="rent" min="1" step="50" value="2501" required>
      </div>
      <div class="field">
        <div class="title">Quartiers acceptés</div>
        <div class="districts">
      <label class="chk">
        <input type="checkbox" name="district" value="Champel" checked>
        Champel
      </label>
      <label class="chk">
        <input type="checkbox" name="district" value="Eaux-Vives" checked>
        Eaux-Vives
      </label>
      <label class="chk">
        <input type="checkbox" name="district" value="Rive" checked>
        Rive
      </label>
      <label class="chk">
        <input type="checkbox" name="district" value="Rives" checked>
        Rives
      </label>
      <label class="chk">
        <input type="checkbox" name="district" value="Plainpalais" checked>
        Plainpalais
      </label>
      <label class="chk">
        <input type="checkbox" name="district" value="Jonction" checked>
        Jonction
      </label>
      <label class="chk">
        <input type="checkbox" name="district" value="Carouge" checked>
        Carouge
      </label>
      <label class="chk">
        <input type="checkbox" name="district" value="Acacias" checked>
        Acacias
      </label>
      <label class="chk">
        <input type="checkbox" name="district" value="Cornavin" checked>
        Cornavin
      </label>
      <label class="chk">
        <input type="checkbox" name="district" value="Pâquis" checked>
        Pâquis
      </label>
      <label class="chk">
        <input type="checkbox" name="district" value="Servette" checked>
        Servette
      </label>
      <label class="chk">
        <input type="checkbox" name="district" value="Grottes" checked>
        Grottes
      </label>
      <label class="chk">
        <input type="checkbox" name="district" value="Petit-Saconnex" checked>
        Petit-Saconnex
      </label>
      <label class="chk">
        <input type="checkbox" name="district" value="Charmilles" checked>
        Charmilles
      </label>
        </div>
      </div>
      <div class="field">
        <div class="title">Type de bien accepté</div>
        <div class="districts">
      <label class="chk">
        <input type="checkbox" name="property_type" value="Dépôt" checked>
        Dépôt
      </label>
      <label class="chk">
        <input type="checkbox" name="property_type" value="Arcade" checked>
        Arcade
      </label>
      <label class="chk">
        <input type="checkbox" name="property_type" value="Atelier" checked>
        Atelier
      </label>
      <label class="chk">
        <input type="checkbox" name="property_type" value="Industriel" checked>
        Industriel
      </label>
      <label class="chk">
        <input type="checkbox" name="property_type" value="Bureau" checked>
        Bureau
      </label>
      <label class="chk">
        <input type="checkbox" name="property_type" value="Local commercial" checked>
        Local commercial
      </label>
        </div>
      </div>
      <div class="field">
        <label class="toggle">
          <input type="checkbox" id="changing-room" checked>
          N'accepter que les locaux avec vestiaires/sanitaires possibles
        </label>
      </div>
      <div class="field">
        <label class="title" for="scan-hour">Heure du scan quotidien (heure de Genève)</label>
        <input type="number" id="scan-hour" min="0" max="23" step="1" value="17" required>
      </div>
      <button type="submit" id="submit-btn">Envoyer les nouveaux critères</button>
      <div id="status"></div>
    </form>
  </div>
</main>
<script>
const WORKER_URL = "https://boxing-gym-criteria.boxinggym-tracker.workers.dev";
const key = new URLSearchParams(location.search).get('key') || '';
const statusEl = document.getElementById('status');
const btn = document.getElementById('submit-btn');

if (!key) {
  statusEl.textContent = "Lien invalide : il manque la clé d'accès. Ouvre cette page depuis le lien reçu par email.";
  statusEl.className = 'err';
  btn.disabled = true;
}

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!WORKER_URL) {
    statusEl.textContent = "Le formulaire n'est pas encore configuré côté serveur (Worker manquant).";
    statusEl.className = 'err';
    return;
  }
  btn.disabled = true;
  statusEl.className = '';
  statusEl.textContent = 'Envoi en cours...';

  const districts = [...document.querySelectorAll('input[name="district"]:checked')].map(el => el.value);
  const propertyTypes = [...document.querySelectorAll('input[name="property_type"]:checked')].map(el => el.value);
  const payload = {
    key,
    min_surface_m2: Number(document.getElementById('surface').value),
    max_rent_chf_month: Number(document.getElementById('rent').value),
    allowed_districts: districts,
    allowed_property_types: propertyTypes,
    require_possible_changing_rooms: document.getElementById('changing-room').checked,
    scan_hour_geneva: Number(document.getElementById('scan-hour').value),
  };

  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.ok) {
      statusEl.textContent = 'Envoyé ! Les nouveaux critères seront actifs au prochain scan (~3h max).';
      statusEl.className = 'ok';
    } else {
      statusEl.textContent = 'Erreur : ' + (data.error || res.statusText);
      statusEl.className = 'err';
      btn.disabled = false;
    }
  } catch (err) {
    statusEl.textContent = 'Erreur réseau, réessaie dans un instant.';
    statusEl.className = 'err';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
