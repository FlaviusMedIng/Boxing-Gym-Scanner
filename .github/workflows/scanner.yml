name: geneva-gym-scanner
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'
permissions:
  contents: write
jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python main.py

      - name: Debug HTML dump
        if: always()
        run: |
          python - <<'EOF'
          import os, re, time
          from playwright.sync_api import sync_playwright
          from bs4 import BeautifulSoup

          os.makedirs("data", exist_ok=True)

          sites = {
            "pilet_renaud": "https://www.pilet-renaud.ch/fr/accueil/search/transaction/rent#dHJhbnNhY3Rpb249cmVudCZ0eXBlPUFSQ0FERSZyb29tX21pbj0xJnJvb21fbWF4PTEyJnByaWNlX21heD04NTAwMDAmcHJpY2VfbWluPTEwMDAwJnN1cmZhY2VfbWluPTUmc3VyZmFjZV9tYXg9MTUwMCZvcmRlcl9ieT1hc2M="
          }

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              for name, url in sites.items():
                  print(f"\n=== {name} ===")
                  try:
                      page = browser.new_page(user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36")
                      page.goto(url, wait_until="domcontentloaded", timeout=60000)
                      time.sleep(5)
                      html = page.content()
                      with open(f"data/debug_{name}.html", "w") as f:
                          f.write(html)
                      print(f"{name}: {len(html)} chars")
                      for keyword in ["propitem", "prop-item", "property", "listing", "arcade", "louer"]:
                          count = html.lower().count(keyword)
                          if count:
                              print(f"  '{keyword}' trouve {count} fois")
                      soup = BeautifulSoup(html, "html.parser")
                      print("\n-- Conteneurs autour de 'arcade' --")
                      for el in soup.find_all(string=re.compile("arcade", re.I))[:3]:
                          parent = el.parent
                          for _ in range(6):
                              if parent is None: break
                              print(f"  TAG={parent.name} | CLASS={parent.get('class')} | ID={parent.get('id','')}")
                              parent = parent.parent
                          print("---")
                  except Exception as e:
                      print(f"ERREUR {name}: {e}")
              browser.close()
          EOF

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-results
          path: |
            data/listings.xlsx
            data/listings.csv
            data/listings.db
            data/scanner.log
            data/debug_homegate.html
            data/debug_pilet_renaud.html
          if-no-files-found: warn

      - name: Commit updated data back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/listings.db data/listings.xlsx data/listings.csv data/scanner.log || true
          git diff --cached --quiet && exit 0
          git commit -m "Update scanner data [skip ci]"
          git push
