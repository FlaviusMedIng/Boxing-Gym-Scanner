name: apply-criteria-update
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  apply:
    if: startsWith(github.event.issue.title, '[criteria-update]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN (même avec `permissions: contents: write`, et même
          # si on ajoute `permissions: workflows: write` — testé et confirmé
          # cassé le 2026-08-30 : ça invalide le workflow entier, 0 jobs ne
          # tournent plus du tout) ne peut JAMAIS pousser de changement sous
          # .github/workflows/ — restriction GitHub non contournable via
          # permissions:. Un PAT dédié avec la permission "Workflows: Read
          # and write" est nécessaire pour ça ; voir WORKFLOW_EDIT_TOKEN
          # dans README.md. S'il est absent, ce step utilise GITHUB_TOKEN et
          # tout continue de marcher SAUF la réécriture de scanner.yml (le
          # step suivant ignore silencieusement cette partie dans ce cas).
          token: ${{ secrets.WORKFLOW_EDIT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Apply criteria from issue
        id: apply
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          # Sans ça, `python scripts/apply_criteria_update.py` met scripts/
          # (pas la racine du repo) sur sys.path, et `from utils.parser
          # import ...` échoue avec ModuleNotFoundError.
          PYTHONPATH: ${{ github.workspace }}
          # Si WORKFLOW_EDIT_TOKEN n'est pas configuré, le checkout a utilisé
          # GITHUB_TOKEN (qui ne peut pas pousser sous .github/workflows/) :
          # le script doit alors s'abstenir de modifier scanner.yml, sinon
          # un commit mixte config.yaml+scanner.yml échouerait en bloc au
          # push (GitHub rejette tout le commit, pas juste ce fichier).
          ALLOW_WORKFLOW_EDIT: ${{ secrets.WORKFLOW_EDIT_TOKEN != '' }}
        run: python scripts/apply_criteria_update.py

      - name: Commit and push config.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.yaml .github/workflows/scanner.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update search criteria from issue #${{ github.event.issue.number }}"
            git push
          fi

      - name: Comment and close issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.apply.outcome }}" = "success" ]; then
            gh issue comment ${{ github.event.issue.number }} --body "Critères mis à jour. Ils seront appliqués au prochain scan quotidien."
            gh issue close ${{ github.event.issue.number }}
          else
            gh issue comment ${{ github.event.issue.number }} --body "La demande n'a pas pu être appliquée (valeurs invalides). Réessaie depuis le formulaire."
          fi
