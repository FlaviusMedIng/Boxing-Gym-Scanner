name: geneva-gym-scanner-weekly-digest
on:
  workflow_dispatch:
  schedule:
    # Lundi matin (l'heure ci-dessous est en UTC, meme mise en garde
    # DST que scanner.yml : sujette a un decalage d'1h autour des
    # changements d'heure tant que personne ne la reajuste).
    - cron: '0 7 * * 1'
permissions:
  contents: read
jobs:
  weekly-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        # Le digest ne scrape rien (lit uniquement data/listings.db, deja a
        # jour via le scan quotidien commite) -- pas besoin de Playwright ici.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send weekly digest
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python scripts/weekly_digest.py
