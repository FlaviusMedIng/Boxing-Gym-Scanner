criteria:
  min_surface_m2: 30
  max_rent_chf_month: 2501
  allowed_districts:
    - Champel
    - Eaux-Vives
    - Rive
    - Rives
    - Plainpalais
    - Jonction
    - Carouge
    - Acacias
    - Cornavin
    - Pâquis
    - Servette
    - Grottes
    - Petit-Saconnex
    - Charmilles
  # Comme allowed_districts : seuls les types cochés ici sont acceptés (pas
  # l'inverse). Actuellement les 6 types existants = aucun filtrage effectif
  # (équivalent à "tout accepté", en attendant que le père restreigne).
  # Modifiable depuis docs/criteria.html sans toucher ce fichier.
  allowed_property_types:
    - Dépôt
    - Arcade
    - Atelier
    - Industriel
    - Bureau
    - Local commercial
  require_possible_changing_rooms: true
  changing_room_keywords:
    - vestiaire
    - vestiaires
    - sanitaire
    - sanitaires
    - douche
    - douches
    - wc
    - toilettes
    - local aménageable
    - arcade
    - open space
  floors_preferred:
    - rez
    - ground
    - arcade

notifications:
  telegram_enabled: true
  email_enabled: true

sites:
  # homegate et comparis sont protégés par des systèmes anti-bot actifs
  # (Cloudflare "Just a moment..." pour homegate, CAPTCHA DataDome pour
  # comparis) qui bloquent tout accès automatisé, même avec un vrai
  # navigateur headless. Contourner ce type de protection ne serait pas
  # correct (ce n'est plus juste "lire une page publique"). Désactivés ici ;
  # utilisez plutôt leurs alertes email natives (voir README).
  homegate:
    enabled: false
    start_urls:
      - "https://www.homegate.ch/rent/industrial-object/city-geneva/matching-list"
  comparis:
    enabled: false
    start_urls:
      - "https://fr.comparis.ch/immobilien/marktplatz/geneve/gewerbeobjekt/mieten"

  realadvisor:
    enabled: true
    start_urls:
      - "https://realadvisor.ch/fr/louer/ville-geneve/commercial"
    max_pages: 1

  rosset:
    enabled: true
    start_urls:
      - "https://www.rosset.ch/louer"
    max_pages: 1

  pilet_renaud:
    enabled: true
    # Le filtre "type" du site est encodé dans le hash-fragment (base64 de
    # "transaction=rent&type=...&room_min=1&room_max=12&price_max=850000
    # &price_min=10000&surface_min=5&surface_max=1500&order_by=asc") et ne
    # peut pas combiner plusieurs types en une seule recherche : une URL par
    # type de bien pertinent (ARCADE, DEPOT — valeurs trouvées dans le
    # formulaire de filtre du site).
    start_urls:
      - "https://www.pilet-renaud.ch/fr/accueil/search/transaction/rent#dHJhbnNhY3Rpb249cmVudCZ0eXBlPUFSQ0FERSZyb29tX21pbj0xJnJvb21fbWF4PTEyJnByaWNlX21heD04NTAwMDAmcHJpY2VfbWluPTEwMDAwJnN1cmZhY2VfbWluPTUmc3VyZmFjZV9tYXg9MTUwMCZvcmRlcl9ieT1hc2M="
      - "https://www.pilet-renaud.ch/fr/accueil/search/transaction/rent#dHJhbnNhY3Rpb249cmVudCZ0eXBlPURFUE9UJnJvb21fbWluPTEmcm9vbV9tYXg9MTImcHJpY2VfbWF4PTg1MDAwMCZwcmljZV9taW49MTAwMDAmc3VyZmFjZV9taW49NSZzdXJmYWNlX21heD0xNTAwJm9yZGVyX2J5PWFzYw=="
    max_pages: 1

  immobilier_ch:
    enabled: true
    start_urls:
      - "https://www.immobilier.ch/fr/louer/commercial-industriel/geneve/canton"
    max_pages: 6

  acheter_louer:
    enabled: true
    start_urls:
      - "https://www.acheter-louer.ch/louer/geneve-locaux-commerciaux-a-louer.html"
    max_pages: 4

  naef:
    enabled: true
    # naef.ch a des catégories distinctes "surface-commerciales" et "depots" ;
    # les deux sont pertinentes (arcade/bureau vs dépôt/stockage).
    start_urls:
      - "https://www.naef.ch/louer/surface-commerciales/geneve/geneve-ville/?sortingField=prix_desc&zoom=8"
      - "https://www.naef.ch/louer/depots/geneve/geneve-ville/?sortingField=prix_desc&zoom=8"
    max_pages: 1

  netimmo:
    # Portail agrégateur (image CDN partagé avec realadvisor.ch — probablement
    # la même source de données) : chevauchement significatif avec le
    # scraper realadvisor déjà actif. Gardé activé quand même (demandé
    # explicitement) — désactiver si les doublons gênent plus qu'ils n'aident.
    enabled: true
    start_urls:
      - "https://www.netimmo.ch/local-commercial-a-louer-ville-geneve"
    max_pages: 4

  moservernet:
    enabled: true
    # "depots-geneve" est une catégorie distincte sur ce site, absente du
    # slug combiné arcades/ateliers/bureaux/surfaces-commerciales.
    start_urls:
      - "https://www.moservernet.ch/louer/arcades-geneve_ateliers-geneve_bureaux-geneve_surfaces-commerciales-geneve/"
      - "https://www.moservernet.ch/louer/depots-geneve/"
    max_pages: 1

output:
  sqlite_path: "data/listings.db"
  excel_path: "data/listings.xlsx"
  csv_path: "data/listings.csv"
  log_path: "data/scanner.log"
  # Page statique publiée gratuitement via GitHub Pages (dossier /docs)
  site_path: "docs/index.html"
  # URL publique GitHub Pages du site (repo public depuis le 2026-08-07),
  # utilisée dans les notifications Telegram/email.
  site_url: "https://flaviusmeding.github.io/Boxing-Gym-Scanner/"
  # Page de formulaire permettant de modifier les critères (min_surface_m2,
  # max_rent_chf_month, allowed_districts, require_possible_changing_rooms)
  # sans compte GitHub ni édition manuelle de ce fichier. Générée à côté de
  # index.html.
  criteria_page_path: "docs/criteria.html"
  # URL du Cloudflare Worker qui reçoit la soumission du formulaire et crée
  # une issue GitHub (voir worker/criteria-worker.js et README). À renseigner
  # après le déploiement du Worker — laisser vide désactive juste le bouton
  # "Envoyer" côté page (affiche un message d'erreur clair).
  criteria_worker_url: "https://boxing-gym-criteria.boxinggym-tracker.workers.dev"

runtime:
  request_timeout_seconds: 90
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36"
  use_playwright_for_dynamic_sites: true
  # Politesse envers les sites scannés : délai entre deux requêtes et
  # nombre de nouvelles tentatives en cas d'échec réseau/timeout.
  delay_between_requests_seconds: 2
  max_retries: 2
  # Heure de Genève à laquelle le scan quotidien tourne. Purement informatif
  # ici (préremplit le champ sur docs/criteria.html) — la valeur qui compte
  # réellement est le cron dans .github/workflows/scanner.yml, réécrit par
  # scripts/apply_criteria_update.py quand ce champ est modifié depuis le
  # site. Approximatif autour des changements d'heure d'été/hiver (le cron
  # GitHub Actions est fixé en UTC, sans notion de fuseau horaire).
  scan_hour_geneva: 17
